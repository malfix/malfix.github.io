<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>malfix.github.io — 10 direzioni per la homepage</title>
<style>
  /* ---------- tokens: lifted from the Tattooo app icon + App Store screenshots ---------- */
  :root {
    --ink:#0e0d10;
    --ink-2:#17151b;
    --lime:#d6f92b;
    --lime-2:#d3ee51;
    --magenta:#ff2e77;
    --magenta-2:#bf3170;
    --paper:#f4f1ea;
    --smoke:#a8a49f;
    --f-display:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --f-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --chrome-h:56px;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--ink); color:#fff; font-family:var(--f-display);
         -webkit-font-smoothing:antialiased; overflow:hidden; }

  /* ---------- stage ---------- */
  #stage { position:fixed; inset:0 0 var(--chrome-h) 0; overflow:auto; }
  body.no-chrome #stage { inset:0; }

  /* ---------- chrome ---------- */
  #chrome { position:fixed; left:0; right:0; bottom:0; height:var(--chrome-h); z-index:9999;
            display:flex; align-items:center; gap:14px; padding:0 14px;
            background:rgba(10,9,12,.82); backdrop-filter:blur(14px) saturate(1.4);
            border-top:1px solid rgba(255,255,255,.10); font-family:var(--f-mono); font-size:11px; }
  body.no-chrome #chrome { transform:translateY(100%); }
  #chrome .grp { display:flex; align-items:center; gap:6px; }
  #chrome .sep { width:1px; height:22px; background:rgba(255,255,255,.12); }
  #chrome button { font:inherit; color:#cfcbc6; background:transparent; cursor:pointer;
                   border:1px solid rgba(255,255,255,.16); border-radius:6px; padding:6px 8px;
                   letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  #chrome button:hover { color:#fff; border-color:rgba(255,255,255,.38); }
  #chrome button[aria-pressed="true"], #chrome .chip.on { background:var(--lime); color:#111;
                   border-color:var(--lime); font-weight:700; }
  #chips { display:flex; gap:4px; overflow-x:auto; flex:1; scrollbar-width:none; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { min-width:26px; }
  #vname { color:#fff; font-size:12px; letter-spacing:.04em; white-space:nowrap; }
  #vname b { color:var(--lime); }
  #vfam { color:var(--smoke); }
  @media (max-width:900px){ #vname .fam { display:none; } }

  /* keyboard hint */
  #hint { position:fixed; right:14px; bottom:calc(var(--chrome-h) + 10px); z-index:9998;
          font-family:var(--f-mono); font-size:10px; color:rgba(255,255,255,.35);
          pointer-events:none; transition:opacity .4s; }
  body.no-chrome #hint { opacity:0; }
</style>
<style id="vcss"></style>
</head>
<body>

<div id="stage" aria-live="polite"></div>

<div id="chrome">
  <span id="vname"></span>
  <div class="sep"></div>
  <div id="chips"></div>
  <div class="sep"></div>
  <div class="grp">
    <button id="btn-lang" title="Lingua del sito">IT / EN</button>
    <button id="btn-many" aria-pressed="false" title="Simula 5 progetti per verificare che il layout scali">×5</button>
    <button id="btn-hide" title="Nascondi questa barra (H)">Nascondi</button>
  </div>
</div>

<div id="hint">← → varianti · L lingua · H barra</div>

<script>
/* =====================================================================
   CONTENT — every variant reads from here, so choosing one costs nothing.
   ===================================================================== */

const COPY = {
  name: "Emanuele Malfarà",
  handle: "malfix",
  role: {
    it: "Costruisco app per iPhone. Da solo, dall'idea all'App Store.",
    en: "I build iPhone apps. Solo, from idea to the App Store."
  },
  roleShort: { it: "Sviluppatore iOS indipendente", en: "Independent iOS developer" },
  projects: { it: "Progetti", en: "Projects" },
  project:  { it: "Progetto",  en: "Project" },
  contact:  { it: "Contatti",  en: "Contact" },
  open:     { it: "Apri",      en: "Open" },
  store:    { it: "App Store", en: "App Store" },
  privacy:  { it: "Privacy",   en: "Privacy" },
  support:  { it: "Supporto",  en: "Support" },
  year:     { it: "Anno",      en: "Year" },
  status:   { it: "Stato",     en: "Status" },
  platform: { it: "Piattaforma", en: "Platform" },
  soon:     { it: "In lavorazione", en: "In progress" },
  live:     { it: "Disponibile", en: "Live" },
  drag:     { it: "Trascina", en: "Drag" },
  move:     { it: "Muovi il mouse", en: "Move your mouse" },
  scroll:   { it: "Scorri", en: "Scroll" }
};

const LINKS = {
  email:  "mailto:malfara.labs@gmail.com",
  emailL: "malfara.labs@gmail.com",
  github: "https://github.com/malfix",
  githubL:"github.com/malfix",
  linkedin:"https://www.linkedin.com/in/emanuelemalfara/",
  linkedinL:"linkedin.com/in/emanuelemalfara"
};

const TATTOOO = {
  id: "tattooo",
  name: "Tattooo",
  year: "2026",
  platform: "iOS",
  live: true,
  kind: { it: "Foto e video", en: "Photo & Video" },
  tagline: {
    it: "Prova un tatuaggio sulla tua pelle prima che sia per sempre.",
    en: "Try a tattoo on your skin before it is permanent."
  },
  blurb: {
    it: "Il disegno segue la forma del corpo, non ci viene incollato sopra. Tutto resta sul telefono: niente account, niente cloud, niente tracciamento.",
    en: "The design follows the shape of your body instead of being pasted on top. Everything stays on the phone: no account, no cloud, no tracking."
  },
  shots: ["assets/tattooo/shot-1.jpg","assets/tattooo/shot-2.jpg","assets/tattooo/shot-3.jpg"],
  icon: "assets/tattooo/icon.svg",
  accent: "#d6f92b",
  href: "https://apps.apple.com/us/app/tattooo/id6795151590",
  links: [
    { label:{it:"App Store",en:"App Store"}, href:"https://apps.apple.com/us/app/tattooo/id6795151590" },
    { label:{it:"Privacy",en:"Privacy"},     href:"https://malfix.github.io/tattooo-legal/privacy.html" },
    { label:{it:"Supporto",en:"Support"},    href:"https://malfix.github.io/tattooo-legal/support.html" }
  ]
};

/* Placeholder projects, only shown with the ×5 toggle, to prove each layout
   scales from one project to many without being redesigned. They deliberately
   have no screenshots so the layouts have to cope with missing art. */
const FILLER = [
  { id:"p2", name:"Senza nome", year:"2026", platform:"iOS",   live:false, accent:"#ff2e77" },
  { id:"p3", name:"Bozza",      year:"2026", platform:"Web",   live:false, accent:"#59c2ff" },
  { id:"p4", name:"Esperimento",year:"2025", platform:"macOS", live:false, accent:"#ffb03a" },
  { id:"p5", name:"Archivio",   year:"2025", platform:"iOS",   live:false, accent:"#8c8c8c" }
].map(p => Object.assign(p, {
  kind:{it:"—",en:"—"},
  tagline:{it:"Slot di esempio: qui finirà il prossimo progetto.",
           en:"Example slot: the next project lands here."},
  blurb:{it:"Serve solo a mostrare come il layout regge quando i progetti diventano tanti.",
         en:"Only here to show how the layout holds up once there are many projects."},
  shots:[], icon:null, href:"#", links:[]
}));

/* =====================================================================
   FRAMEWORK
   ===================================================================== */

const state = { v:0, lang:"it", many:false, chrome:true };
const stage = document.getElementById("stage");
const vcss  = document.getElementById("vcss");
let teardown = null;

const t  = (x) => (x && typeof x === "object" && !Array.isArray(x)) ? (x[state.lang] ?? x.it) : x;
const projects = () => state.many ? [TATTOOO, ...FILLER] : [TATTOOO];
const statusOf = (p) => p.live ? t(COPY.live) : t(COPY.soon);

function el(tag, props, kids) {
  const n = document.createElement(tag);
  for (const k in (props||{})) {
    if (k === "class") n.className = props[k];
    else if (k === "html") n.innerHTML = props[k];
    else if (k === "text") n.textContent = props[k];
    else if (k === "style") n.setAttribute("style", props[k]);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);
    else if (props[k] != null && props[k] !== false) n.setAttribute(k, props[k]);
  }
  for (const c of [].concat(kids||[])) if (c != null) n.append(c.nodeType ? c : String(c));
  return n;
}

/* A small on/off collection so every mount can clean up after itself. */
function bag() {
  const offs = [];
  return {
    on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); offs.push(() => target.removeEventListener(ev, fn, opt)); },
    raf(loop) { let id, alive = true;
      const step = (ts) => { if (!alive) return; loop(ts); id = requestAnimationFrame(step); };
      id = requestAnimationFrame(step);
      offs.push(() => { alive = false; cancelAnimationFrame(id); }); },
    timer(fn, ms) { const id = setInterval(fn, ms); offs.push(() => clearInterval(id)); return id; },
    add(fn) { offs.push(fn); },
    run() { offs.forEach(f => { try { f(); } catch (e) {} }); }
  };
}

/* =====================================================================
   VARIANT 01 — TERMINAL ROSTER      family: raw / neubrutalist
   The page is a prompt. Projects are the output of a command. Adding a
   project is adding a line: the layout cannot break as the list grows.
   ===================================================================== */
const V_TERMINAL = {
  id:"terminal", label:{it:"Terminal Roster",en:"Terminal Roster"}, fam:"raw",
  css:`
  .tm{min-height:100%;background:#0b0a0d;color:#d8d5d0;font-family:var(--f-mono);
      font-size:14px;line-height:1.85;padding:clamp(20px,5vw,64px);position:relative;overflow:hidden;
      display:flex;align-items:center}
  .tm::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
  .tm-w{width:100%;max-width:78ch;margin:0 auto;position:relative;z-index:1}
  .tm-h{color:#5f5c58}
  .tm-p{color:var(--lime)}
  .tm-c{color:#fff}
  .tm-out{margin:2px 0 26px;white-space:pre-wrap}
  .tm-row{display:grid;grid-template-columns:2.5ch 1fr 8ch 7ch;gap:0 1.5ch;padding:3px 8px;
      margin:0 -8px;border-radius:3px;cursor:pointer;text-decoration:none;color:inherit;align-items:baseline}
  .tm-row:hover{background:var(--lime);color:#0b0a0d}
  .tm-row:hover .tm-dim{color:#0b0a0d}
  .tm-nm{color:#fff;font-weight:700}
  .tm-row:hover .tm-nm{color:#0b0a0d}
  .tm-dim{color:#6d6a66}
  .tm-tag{font-size:13px;color:#8f8c88;padding-left:4ch}
  .tm-row:hover + .tm-tag{color:var(--lime)}
  .tm-cur{display:inline-block;width:9px;height:1.05em;background:var(--lime);
      vertical-align:-2px;animation:tmblink 1.05s steps(1) infinite}
  @keyframes tmblink{50%{opacity:0}}
  .tm-a{color:var(--lime);text-decoration:none;border-bottom:1px dashed rgba(214,249,43,.4)}
  .tm-a:hover{background:var(--lime);color:#0b0a0d;border-color:transparent}
  .tm-hero{font-size:clamp(28px,6vw,52px);line-height:1.05;font-weight:700;color:#fff;
      letter-spacing:-.02em;margin:0 0 6px;font-family:var(--f-mono)}
  .tm-hero em{font-style:normal;background:var(--lime);color:#0b0a0d;padding:0 .18em}
  `,
  mount(root, b) {
    const w = el("div", { class:"tm-w" });
    root.append(el("div", { class:"tm" }, w));

    const line = (h, c) => el("div", null, [ el("span",{class:"tm-p",text:"➜ "}), el("span",{class:"tm-h",text:h}), el("span",{class:"tm-c",text:c}) ]);

    w.append(el("h1", { class:"tm-hero", html:`malfar<em>à</em>` }));
    w.append(el("div", { class:"tm-out tm-h", text:t(COPY.role) }));

    w.append(line("~ ", "ls projects/"));
    const out = el("div", { class:"tm-out" });
    w.append(out);
    for (const p of projects()) {
      out.append(el("a", { class:"tm-row", href:p.href, target:"_blank", rel:"noopener" }, [
        el("span",{class:"tm-dim",text:p.live ? "▸" : "·"}),
        el("span",{class:"tm-nm",text:p.name.toLowerCase()}),
        el("span",{class:"tm-dim",text:p.platform}),
        el("span",{class:"tm-dim",text:p.year})
      ]));
      out.append(el("div", { class:"tm-tag", text:t(p.tagline) }));
    }

    w.append(line("~ ", "cat contact.txt"));
    const c = el("div", { class:"tm-out" });
    c.append(el("div", null, [ el("span",{class:"tm-dim",text:"email  "}), el("a",{class:"tm-a",href:LINKS.email,text:LINKS.emailL}) ]));
    c.append(el("div", null, [ el("span",{class:"tm-dim",text:"github "}), el("a",{class:"tm-a",href:LINKS.github,target:"_blank",rel:"noopener",text:LINKS.githubL}) ]));
    c.append(el("div", null, [ el("span",{class:"tm-dim",text:"linked "}), el("a",{class:"tm-a",href:LINKS.linkedin,target:"_blank",rel:"noopener",text:LINKS.linkedinL}) ]));
    w.append(c);

    w.append(line("~ ", `lang --set ${state.lang === "it" ? "en" : "it"}`));
    const sw = el("div", { class:"tm-out" }, [
      el("a", { class:"tm-a", href:"#", onclick:(e)=>{ e.preventDefault(); toggleLang(); },
                text: state.lang === "it" ? "switch to english" : "passa all'italiano" })
    ]);
    w.append(sw);

    w.append(el("div", null, [ el("span",{class:"tm-p",text:"➜ "}), el("span",{class:"tm-cur"}) ]));

    w.style.opacity = "0";
    requestAnimationFrame(() => { w.style.transition = "opacity .5s"; w.style.opacity = "1"; });
  }
};

/* =====================================================================
   VARIANT 02 — FLASH SHEET          family: raw / neubrutalist
   The page is a tattoo flash sheet, exactly like the app icon: crooked
   cards, thick black outline, lime fill, magenta offset. One flash per
   project — the sheet just gets fuller.
   ===================================================================== */
const V_FLASH = {
  id:"flash", label:{it:"Flash Sheet",en:"Flash Sheet"}, fam:"raw",
  css:`
  .fs{min-height:100%;background:#111014;overflow-x:clip;
      padding:clamp(20px,4vw,56px) clamp(16px,4vw,56px) 70px;
      background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);
      background-size:22px 22px}
  .fs-w{max-width:1180px;margin:0 auto}
  .fs-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:44px}
  .fs-name{font-size:clamp(38px,9vw,88px);font-weight:800;font-style:italic;letter-spacing:-.035em;
      line-height:.92;margin:0;color:#fff}
  .fs-name em{font-style:italic;background:var(--lime);color:#111014;padding:0 .1em;
      box-shadow:7px 7px 0 var(--magenta)}
  .fs-role{margin:24px 0 0;max-width:40ch;color:#b9b5b0;line-height:1.6;
      text-transform:uppercase;letter-spacing:.09em;font-weight:700;font-size:12px}
  .fs-lang{display:flex;gap:0}
  .fs-lang button{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.1em;
      padding:9px 14px;border:3px solid #000;background:#fff;color:#111;cursor:pointer;
      box-shadow:4px 4px 0 #000}
  .fs-lang button.on{background:var(--lime)}
  .fs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:34px 30px}
  /* one project alone becomes a wide hero card instead of a lonely tile */
  .fs-grid[data-n="1"]{grid-template-columns:minmax(0,860px)}
  .fs-grid[data-n="1"] .fs-card{display:grid;grid-template-columns:minmax(0,300px) 1fr}
  .fs-grid[data-n="1"] .fs-art{aspect-ratio:auto;border-bottom:0;border-right:4px solid #000;
      height:100%;max-height:430px}
  .fs-grid[data-n="1"] .fs-art img{object-position:top center}
  .fs-grid[data-n="1"] .fs-meta{align-self:center;padding:clamp(18px,3vw,34px)}
  .fs-grid[data-n="1"] .fs-t{font-size:clamp(30px,5vw,46px)}
  .fs-grid[data-n="1"] .fs-d{font-size:16px;max-width:36ch;margin-top:10px}
  .fs-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  .fs-links a{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;text-decoration:none;color:#111;border:3px solid #000;padding:9px 14px;
      background:#fff;box-shadow:4px 4px 0 #000;transition:.14s}
  .fs-links a:hover{background:#111;color:var(--lime);box-shadow:4px 4px 0 var(--magenta)}
  .fs-links a.pri{background:#111;color:var(--lime)}
  .fs-links a.pri:hover{background:#fff;color:#111}
  @media (max-width:640px){
    .fs-grid[data-n="1"] .fs-card{grid-template-columns:1fr}
    .fs-grid[data-n="1"] .fs-art{border-right:0;border-bottom:4px solid #000;aspect-ratio:1/1;min-height:0}
  }
  .fs-card{position:relative;display:block;text-decoration:none;color:#111;background:var(--lime);
      border:4px solid #000;box-shadow:12px 12px 0 var(--magenta);padding:0;
      transition:transform .22s cubic-bezier(.2,.9,.3,1.4),box-shadow .22s}
  .fs-card:nth-child(3n+1){transform:rotate(-2.1deg)}
  .fs-card:nth-child(3n+2){transform:rotate(1.4deg)}
  .fs-card:nth-child(3n+3){transform:rotate(-.8deg)}
  .fs-card:hover{transform:rotate(0) translate(-4px,-6px);box-shadow:18px 20px 0 var(--magenta);z-index:2}
  .fs-art{aspect-ratio:1/1;border-bottom:4px solid #000;overflow:hidden;position:relative;
      display:grid;place-items:center;background:#111014}
  .fs-art img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .fs-art .ico{width:62%;height:62%}
  .fs-blank{width:100%;height:100%;display:grid;place-items:center;
      background:repeating-linear-gradient(45deg,#1a1820 0 12px,#131118 12px 24px)}
  .fs-blank span{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:#5d5a63}
  .fs-meta{padding:14px 16px 16px}
  .fs-t{font-size:23px;font-weight:800;font-style:italic;letter-spacing:-.02em;margin:0;text-transform:lowercase}
  .fs-d{margin:6px 0 0;font-size:13px;line-height:1.4;color:#1d2404;font-weight:600}
  .fs-badge{position:absolute;top:-14px;right:-10px;background:#000;color:var(--lime);
      font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.14em;padding:5px 9px;
      border:3px solid var(--lime);transform:rotate(6deg)}
  .fs-foot{margin-top:56px;display:flex;flex-wrap:wrap;gap:12px}
  .fs-chip{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;text-decoration:none;color:#fff;border:3px solid #fff;padding:9px 15px;
      transition:.15s}
  .fs-chip:hover{background:var(--lime);border-color:var(--lime);color:#111}
  `,
  mount(root, b) {
    const w = el("div", { class:"fs-w" });
    root.append(el("div", { class:"fs" }, w));

    const langBtn = (code) => el("button", { class: state.lang===code?"on":"", text:code.toUpperCase(),
      onclick:()=>{ if (state.lang!==code) toggleLang(); } });

    w.append(el("div", { class:"fs-top" }, [
      el("div", null, [
        el("h1", { class:"fs-name", html:`Emanuele<br>Malf<em>arà</em>` }),
        el("p",  { class:"fs-role", text:t(COPY.role) })
      ]),
      el("div", { class:"fs-lang" }, [ langBtn("it"), langBtn("en") ])
    ]));

    const list = projects();
    const single = list.length === 1;
    const grid = el("div", { class:"fs-grid", "data-n":list.length });
    for (const p of list) {
      const art = el("div", { class:"fs-art" });
      if (p.shots.length) art.append(el("img", { src:p.shots[0], alt:p.name, loading:"lazy" }));
      else if (p.icon)    art.append(el("img", { class:"ico", src:p.icon, alt:p.name }));
      else                art.append(el("div", { class:"fs-blank" }, el("span", { text:"WIP" })));

      const meta = el("div", { class:"fs-meta" }, [
        el("h2", { class:"fs-t", text:p.name.toLowerCase() }),
        el("p",  { class:"fs-d", text:t(single ? p.blurb || p.tagline : p.tagline) })
      ]);
      /* alone on the sheet, the card gets room for the real links */
      if (single && p.links.length) {
        meta.append(el("div", { class:"fs-links" },
          p.links.map((l, i) => el("a", { class:i === 0 ? "pri" : "", href:l.href,
                                          target:"_blank", rel:"noopener", text:t(l.label) + " ↗" }))));
      }

      const inner = [ art, meta, el("span", { class:"fs-badge", text:statusOf(p).toUpperCase() }) ];
      grid.append(single
        ? el("div", { class:"fs-card" }, inner)
        : el("a", { class:"fs-card", href:p.href, target:p.href==="#"?null:"_blank", rel:"noopener" }, inner));
    }
    w.append(grid);

    w.append(el("div", { class:"fs-foot" }, [
      el("a", { class:"fs-chip", href:LINKS.email, text:LINKS.emailL }),
      el("a", { class:"fs-chip", href:LINKS.github, target:"_blank", rel:"noopener", text:LINKS.githubL }),
      el("a", { class:"fs-chip", href:LINKS.linkedin, target:"_blank", rel:"noopener", text:LINKS.linkedinL })
    ]));
  }
};

/* =====================================================================
   VARIANT 03 — WINDOWED CONSOLE     family: raw / playful
   A tiny desktop. Every project is a draggable window; a new project is
   a new window. Visitors play instead of scrolling.
   ===================================================================== */
const V_WINDOWS = {
  id:"windows", label:{it:"Console finestrata",en:"Windowed console"}, fam:"raw",
  css:`
  .wd{position:relative;min-height:100%;background:#191722;overflow:hidden;
      background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:32px 32px}
  .wd-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;
      height:34px;padding:0 14px;background:#0f0e14;border-bottom:2px solid #000;
      font-family:var(--f-mono);font-size:12px;color:#cbc7d2}
  .wd-bar b{color:var(--lime)}
  .wd-bar .sp{flex:1}
  .wd-bar button{font:inherit;background:none;border:0;color:#cbc7d2;cursor:pointer;padding:4px 6px}
  .wd-bar button:hover{background:var(--lime);color:#0f0e14}
  .win{position:absolute;background:#221f2c;border:3px solid #000;
       box-shadow:9px 9px 0 rgba(0,0,0,.55);min-width:250px;display:flex;flex-direction:column}
  .win-t{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;
       background:var(--lime);color:#0f0e14;cursor:grab;user-select:none;
       font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.06em;border-bottom:3px solid #000}
  .win.alt .win-t{background:var(--magenta);color:#fff}
  .win-t .sp{flex:1}
  .win-x{width:17px;height:17px;display:grid;place-items:center;background:#0f0e14;color:var(--lime);
       border:2px solid #0f0e14;font-size:11px;line-height:1;cursor:pointer}
  .win-x:hover{background:#fff;color:#000}
  .win-b{padding:14px;color:#ddd9e6;font-size:14px;line-height:1.55;overflow:auto}
  .win-b img{display:block;width:100%;max-height:290px;object-fit:cover;object-position:top center;
       border:2px solid #000;margin-bottom:10px}
  .win-b h3{margin:0 0 4px;font-size:20px;font-weight:800;font-style:italic;color:#fff}
  .win-b .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:#8c86a0;text-transform:uppercase}
  .win-b a{color:var(--lime)}
  .win-cta{display:inline-block;margin-top:10px;background:var(--lime);color:#0f0e14;text-decoration:none;
       font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em;padding:8px 12px;
       border:2px solid #000;box-shadow:4px 4px 0 #000}
  .win-cta:hover{background:#fff}
  .wd-dock{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;z-index:40;flex-wrap:wrap}
  .wd-dock button{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
       background:#0f0e14;color:#9d98ad;border:2px solid #000;padding:7px 10px;cursor:pointer}
  .wd-dock button:hover{color:var(--lime)}
  `,
  mount(root, b) {
    const desk = el("div", { class:"wd" });
    root.append(desk);

    desk.append(el("div", { class:"wd-bar" }, [
      el("b", { text:"malfarà.os" }),
      el("span", { text:t(COPY.projects).toLowerCase() + " (" + projects().length + ")" }),
      el("span", { class:"sp" }),
      el("button", { text:state.lang.toUpperCase(), onclick:toggleLang })
    ]));

    const dock = el("div", { class:"wd-dock" });
    desk.append(dock);
    let z = 10;

    function win(opts) {
      const node = el("div", { class:"win" + (opts.alt ? " alt" : ""),
        style:`left:${opts.x}px;top:${opts.y}px;width:${opts.w}px;max-height:70vh` });
      const title = el("div", { class:"win-t" }, [
        el("span", { text:opts.title }), el("span", { class:"sp" }),
        el("span", { class:"win-x", text:"×", onclick:(e)=>{ e.stopPropagation(); node.style.display="none"; } })
      ]);
      node.append(title, el("div", { class:"win-b" }, opts.body));
      node.style.zIndex = ++z;
      desk.append(node);

      let dx=0, dy=0, dragging=false;
      const down = (e) => { dragging = true; node.style.zIndex = ++z; title.style.cursor="grabbing";
        const r = node.getBoundingClientRect(), dr = desk.getBoundingClientRect();
        dx = e.clientX - (r.left - dr.left); dy = e.clientY - (r.top - dr.top);
        e.preventDefault(); };
      const move = (e) => { if (!dragging) return;
        node.style.left = Math.max(0, e.clientX - dx) + "px";
        node.style.top  = Math.max(0, e.clientY - dy) + "px"; };
      const up = () => { dragging = false; title.style.cursor="grab"; };
      b.on(title, "pointerdown", down); b.on(window, "pointermove", move); b.on(window, "pointerup", up);
      b.on(node, "pointerdown", () => { node.style.zIndex = ++z; });

      dock.append(el("button", { text:opts.title, onclick:()=>{ node.style.display=""; node.style.zIndex=++z; } }));
      return node;
    }

    const W = desk.clientWidth || window.innerWidth;
    win({ title:"about.txt", x:Math.min(40, W*.04), y:70, w:340, alt:true, body:[
      el("h3", { text:COPY.name }),
      el("p", { style:"margin:6px 0 0", text:t(COPY.role) }),
      el("p", { class:"k", style:"margin-top:12px", text:t(COPY.contact) }),
      el("p", { style:"margin:2px 0 0" }, [ el("a", { href:LINKS.email, text:LINKS.emailL }) ]),
      el("p", { style:"margin:2px 0 0" }, [ el("a", { href:LINKS.github, target:"_blank", rel:"noopener", text:LINKS.githubL }) ]),
      el("p", { style:"margin:2px 0 0" }, [ el("a", { href:LINKS.linkedin, target:"_blank", rel:"noopener", text:LINKS.linkedinL }) ])
    ]});

    projects().forEach((p, i) => {
      const body = [];
      if (p.shots.length) body.push(el("img", { src:p.shots[0], alt:p.name, loading:"lazy" }));
      body.push(el("h3", { text:p.name }));
      body.push(el("p", { class:"k", text:`${p.platform} · ${p.year} · ${statusOf(p)}` }));
      body.push(el("p", { style:"margin:8px 0 0", text:t(p.tagline) }));
      if (p.href !== "#") body.push(el("a", { class:"win-cta", href:p.href, target:"_blank", rel:"noopener", text:"App Store ↗" }));
      win({ title:p.name.toLowerCase()+".app", w:320,
            x:Math.min(W - 340, 420 + i*46), y:120 + i*38, body });
    });
  }
};

/* =====================================================================
   VARIANT 05 — DEPARTURE BOARD      family: typographic / kinetic
   Split-flap board. Rows flip on arrival and on every language change,
   so the IT/EN switch becomes the animation instead of a detail.
   ===================================================================== */
const V_BOARD = {
  id:"board", label:{it:"Departure Board",en:"Departure board"}, fam:"typographic",
  css:`
  .bd{min-height:100%;background:#0a0a0b;padding:clamp(20px,4vw,60px) clamp(14px,4vw,60px);
      font-family:var(--f-mono);display:flex;align-items:center}
  .bd-w{width:100%;max-width:1080px;margin:0 auto}
  .bd-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
      padding-bottom:18px;border-bottom:2px solid #26242c;margin-bottom:26px;flex-wrap:wrap}
  .bd-name{font-family:var(--f-display);font-size:clamp(26px,5vw,44px);font-weight:800;font-style:italic;
      letter-spacing:-.03em;color:#fff;margin:0}
  .bd-role{margin:6px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6f6b78}
  .bd-clock{font-size:clamp(22px,4vw,38px);color:var(--lime);letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .bd-hd,.bd-row{display:grid;gap:0 clamp(8px,1.6vw,20px);align-items:center;
      grid-template-columns:5.5ch minmax(0,1fr) 13ch 7ch 17ch;
      grid-template-areas:"n p pl y s"}
  .bd-hd{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#5b5866;padding:0 10px 8px}
  .bd-row{background:#131218;border:1px solid #24222c;margin-bottom:6px;padding:12px 10px;
      text-decoration:none;color:#e6e3ec;transition:background .18s,border-color .18s}
  .bd-c1{grid-area:n} .bd-c2{grid-area:p} .bd-c3{grid-area:pl} .bd-c4{grid-area:y} .bd-c5{grid-area:s}
  @media (max-width:760px){
    .bd-hd{display:none}
    .bd-row{grid-template-columns:5ch minmax(0,1fr) auto;
            grid-template-areas:"n p p" ". pl y" ". s s";row-gap:5px;padding:12px}
    .bd-c1{align-self:start}
  }
  .bd-row:hover{background:#1b1924;border-color:var(--lime)}
  .flap{display:inline-flex}
  .flap span{display:inline-block;min-width:.62em;background:#000;border-radius:2px;
      padding:2px 1px;margin-right:1px;text-align:center;color:#fff;
      box-shadow:inset 0 -1px 0 rgba(255,255,255,.14)}
  .bd-nm .flap span{font-size:clamp(15px,2.4vw,22px);font-weight:700;color:#fff}
  .bd-sm .flap span{font-size:11px;color:#b6b2c2}
  .bd-st .flap span{font-size:11px;color:var(--lime);letter-spacing:.06em}
  .bd-row.off .bd-st .flap span{color:var(--magenta)}
  .bd-foot{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px 26px;font-size:12px;letter-spacing:.06em}
  .bd-foot a{color:var(--lime);text-decoration:none;border-bottom:1px solid rgba(214,249,43,.35)}
  .bd-foot button{font:inherit;letter-spacing:.06em;background:none;border:0;color:#6f6b78;cursor:pointer;
      text-decoration:underline;text-underline-offset:3px;padding:0}
  `,
  mount(root, b) {
    const w = el("div", { class:"bd-w" });
    root.append(el("div", { class:"bd" }, w));

    const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZÀÈÉÌÒÙ0123456789 ·—.";
    function flap(text, delay) {
      const holder = el("span", { class:"flap" });
      [...text.toUpperCase()].forEach((ch, i) => {
        const s = el("span", { text:" " });
        holder.append(s);
        let n = 0;
        const steps = 6 + ((i * 3 + delay) % 9);
        const id = setInterval(() => {
          n++;
          if (n >= steps) { s.textContent = ch === " " ? " " : ch; clearInterval(id); }
          else s.textContent = CHARS[(Math.random() * CHARS.length) | 0];
        }, 34);
        b.add(() => clearInterval(id));
      });
      return holder;
    }

    const clock = el("div", { class:"bd-clock", text:"--:--:--" });
    const tick = () => { const d = new Date();
      clock.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2,"0")).join(":"); };
    tick(); b.timer(tick, 1000);

    w.append(el("div", { class:"bd-top" }, [
      el("div", null, [
        el("h1", { class:"bd-name", text:COPY.name }),
        el("p",  { class:"bd-role", text:t(COPY.role) })
      ]),
      clock
    ]));

    w.append(el("div", { class:"bd-hd" }, [
      el("span", { class:"bd-c1", text:"№" }), el("span", { class:"bd-c2", text:t(COPY.project) }),
      el("span", { class:"bd-c3", text:t(COPY.platform) }), el("span", { class:"bd-c4", text:t(COPY.year) }),
      el("span", { class:"bd-c5", text:t(COPY.status) })
    ]));

    projects().forEach((p, i) => {
      w.append(el("a", { class:"bd-row" + (p.live ? "" : " off"), href:p.href,
                         target:p.href==="#"?null:"_blank", rel:"noopener" }, [
        el("span", { class:"bd-sm bd-c1" }, flap(String(i+1).padStart(2,"0"), i)),
        el("span", { class:"bd-nm bd-c2" }, flap(p.name, i*2)),
        el("span", { class:"bd-sm bd-c3" }, flap(p.platform, i*3)),
        el("span", { class:"bd-sm bd-c4" }, flap(p.year, i*4)),
        el("span", { class:"bd-st bd-c5" }, flap(statusOf(p), i*5))
      ]));
    });

    w.append(el("div", { class:"bd-foot" }, [
      el("a", { href:LINKS.email, text:LINKS.emailL }),
      el("a", { href:LINKS.github, target:"_blank", rel:"noopener", text:LINKS.githubL }),
      el("a", { href:LINKS.linkedin, target:"_blank", rel:"noopener", text:LINKS.linkedinL }),
      el("button", { text:state.lang === "it" ? "ENGLISH" : "ITALIANO", onclick:toggleLang })
    ]));
  }
};

/* =====================================================================
   VARIANT 06 — MARQUEE MANIFESTO    family: typographic / kinetic
   Bands of type sliding at different speeds. Project bands are links.
   Needs no imagery at all — the motion is the design.
   ===================================================================== */
const V_MARQUEE = {
  id:"marquee", label:{it:"Marquee Manifesto",en:"Marquee manifesto"}, fam:"typographic",
  css:`
  .mq{min-height:100%;background:#0c0b0f;display:flex;flex-direction:column;justify-content:center;
      gap:clamp(4px,.8vw,10px);padding:clamp(14px,3vw,34px) 0;overflow:hidden}
  .mq-band{position:relative;overflow:hidden;white-space:nowrap;display:block;text-decoration:none}
  .mq-track{display:inline-flex;will-change:transform;animation:mqs var(--d,26s) linear infinite}
  .mq-band.rev .mq-track{animation-direction:reverse}
  @keyframes mqs{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
  .mq-band:hover .mq-track{animation-play-state:paused}
  .mq-u{font-size:clamp(34px,8.4vw,110px);font-weight:800;font-style:italic;letter-spacing:-.035em;
      line-height:1;padding-right:.45em;display:inline-block}
  .mq-name .mq-u{color:#fff}
  .mq-role{border-block:1px solid #26242c}
  .mq-role .mq-u{font-size:clamp(12px,1.6vw,17px);font-weight:600;font-style:normal;
      letter-spacing:.22em;text-transform:uppercase;color:#8c8798;padding:9px .9em 9px 0}
  .mq-proj{border-block:2px solid transparent;transition:background .2s,border-color .2s}
  .mq-proj .mq-u{color:#3b3846;-webkit-text-stroke:1.5px #55515f;
      -webkit-text-fill-color:transparent;transition:color .2s}
  .mq-proj:hover{background:var(--lime)}
  .mq-proj:hover .mq-u{-webkit-text-stroke:0;-webkit-text-fill-color:#0c0b0f;color:#0c0b0f}
  .mq-proj .dot{font-size:.42em;vertical-align:.32em;padding:0 .35em;opacity:.55}
  .mq-lime .mq-u{-webkit-text-stroke:0;-webkit-text-fill-color:var(--lime)}
  .mq-mag{background:var(--magenta)}
  .mq-mag .mq-u{-webkit-text-stroke:0;-webkit-text-fill-color:#fff;
      font-size:clamp(11px,1.4vw,15px);font-style:normal;font-weight:700;letter-spacing:.2em;
      text-transform:uppercase;padding:8px .8em 8px 0}
  .mq-foot{display:flex;justify-content:center;gap:26px;margin-top:clamp(10px,2vw,22px);
      font-family:var(--f-mono);font-size:12px;letter-spacing:.08em}
  .mq-foot a,.mq-foot button{color:#8c8798;text-decoration:none;background:none;border:0;
      font:inherit;letter-spacing:.08em;cursor:pointer}
  .mq-foot a:hover,.mq-foot button:hover{color:var(--lime)}
  `,
  mount(root, b) {
    const wrap = el("div", { class:"mq" });
    root.append(wrap);

    /* duplicate the content once so the -50% translate loops seamlessly */
    function band(cls, dur, rev, chunks) {
      const track = el("div", { class:"mq-track" });
      for (let r = 0; r < 2; r++) for (const c of chunks) track.append(c.cloneNode(true));
      return el("div", { class:"mq-band " + cls + (rev ? " rev" : ""), style:`--d:${dur}s` }, track);
    }
    const u = (text, extra) => el("span", { class:"mq-u" + (extra ? " " + extra : ""), text });

    const nameChunks = [];
    for (let i = 0; i < 4; i++) nameChunks.push(u("Emanuele Malfarà"), u("·"));
    wrap.append(band("mq-name", 34, false, nameChunks));

    const roleChunks = [];
    for (let i = 0; i < 4; i++) roleChunks.push(u(t(COPY.role)), u("/"));
    wrap.append(band("mq-role", 40, true, roleChunks));

    projects().forEach((p, i) => {
      const chunks = [];
      for (let k = 0; k < 4; k++) {
        chunks.push(u(p.name));
        chunks.push(el("span", { class:"mq-u dot", text:"●" }));
        chunks.push(u(`${p.platform} ${p.year}`));
        chunks.push(el("span", { class:"mq-u dot", text:"●" }));
      }

      ]);
      if (p.href !== "#") info.append(el("a", { class:"st-cta", href:p.href, target:"_blank", rel:"noopener",
                                               text:t(COPY.store) + " ↗" }));
      card.append(info);
      deck.append(card);
      return card;
    });

    const dots = el("div", { class:"st-dots" });
    list.forEach(() => dots.append(el("i")));
    const prev = el("button", { text:"‹" });
    const next = el("button", { text:"›" });
    const counter = el("span", { text:"" });

      el("a", { href:LINKS.github, target:"_blank", rel:"noopener", text:LINKS.githubL }),
      el("a", { href:LINKS.linkedin, target:"_blank", rel:"noopener", text:LINKS.linkedinL })
    ]));

    let idx = 0, drag = 0, dragging = false, startX = 0;
    function layout() {
      cards.forEach((c, i) => {
        const d = i - idx;
        const off = d * 26 + (dragging ? drag * .35 : 0);
        const depth = Math.abs(d);
        c.style.transform = `translate3d(${off}px,${depth * 16}px,${-depth * 130}px) rotateY(${d * -5}deg) rotate(${d * 1.6}deg) scale(${1 - depth * .06})`;
        c.style.opacity = depth > 3 ? 0 : 1 - depth * .18;
        c.style.filter = depth ? `brightness(${1 - depth * .16}) saturate(${1 - depth * .2})` : "none";
        c.style.zIndex = 100 - depth;
        c.style.pointerEvents = d === 0 ? "auto" : "none";
        c.style.transition = dragging ? "none" : "";
      });
      [...dots.children].forEach((n, i) => n.classList.toggle("on", i === idx));
      counter.textContent = `${String(idx + 1).padStart(2,"0")} / ${String(list.length).padStart(2,"0")}`;
      prev.disabled = idx === 0; next.disabled = idx === list.length - 1;
      prev.style.opacity = idx === 0 ? .3 : 1; next.style.opacity = idx === list.length - 1 ? .3 : 1;
    }
    const go = (n) => { idx = Math.max(0, Math.min(list.length - 1, n)); layout(); };
    b.on(prev, "click", () => go(idx - 1));
    b.on(next, "click", () => go(idx + 1));

    b.on(deck, "pointerdown", (e) => { if (e.target.closest("a")) return;
      dragging = true; startX = e.clientX; drag = 0; layout(); });
    b.on(window, "pointermove", (e) => { if (!dragging) return; drag = e.clientX - startX; layout(); });
    b.on(window, "pointerup", () => { if (!dragging) return;
      const d = drag; dragging = false; drag = 0;
      if (d < -60) go(idx + 1); else if (d > 60) go(idx - 1); else layout(); });

    let wheelLock = 0;
    b.on(deck, "wheel", (e) => { const now = performance.now(); if (now - wheelLock < 420) return;
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 12) return; wheelLock = now; go(idx + (d > 0 ? 1 : -1)); }, { passive:true });

    layout();
  }
};

      uniform sampler2D u_tex;uniform float u_t;uniform vec2 u_res;varying vec2 v;

      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
      float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p*=2.03;a*=.5;}return s;}
      void main(){

        vec3 deep=vec3(0.749,0.192,0.439);
        vec3 hot=vec3(0.839,0.976,0.169);
        vec3 ink=mix(deep,hot,smoothstep(0.40,0.95,d));
        float edge=smoothstep(0.02,0.26,d);
        vec3 col=mix(bg,ink,edge*0.88);
        col+=hot*smoothstep(0.90,1.0,d)*0.22;
        col+=(hash(v*u_res+u_t)-0.5)*0.032;
        gl_FragColor=vec4(col,1.0);
      }`;

    function sh(type, src) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
      return s;
    }
    function prog(fs) {
      const p = gl.createProgram();
      const a = sh(gl.VERTEX_SHADER, VERT), c = sh(gl.FRAGMENT_SHADER, fs);
      if (!a || !c) return null;
      gl.attachShader(p, a); gl.attachShader(p, c); gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(p)); return null; }
      return p;
    }
    const pSim = prog(SIM), pDraw = prog(DRAW);
    if (!pSim || !pDraw) { canvas.remove(); wrap.prepend(el("div", { class:"ik-fb" })); return; }

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    for (const p of [pSim, pDraw]) {
      const loc = gl.getAttribLocation(p, "a");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    }

    let SW = 0, SH = 0, fbo = [], tex = [], cur = 0;
    function makeTarget(wpx, hpx) {
      const tx = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tx);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, wpx, hpx, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tx, 0);
      gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
      return { tx, fb };
    }
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 1.75);
      const cw = Math.max(1, Math.floor(window.innerWidth * dpr));
      const ch = Math.max(1, Math.floor(window.innerHeight * dpr));
      canvas.width = cw; canvas.height = ch;
      SW = Math.max(64, Math.floor(cw / 2)); SH = Math.max(64, Math.floor(ch / 2));
      fbo.forEach(o => { gl.deleteTexture(o.tx); gl.deleteFramebuffer(o.fb); });
      fbo = [makeTarget(SW, SH), makeTarget(SW, SH)];
      tex = fbo.map(o => o.tx);
    }
    resize();
    b.on(window, "resize", resize);

    let mx = .5, my = .5, pmx = .5, pmy = .5, moving = 0, seeded = 40;
    b.on(window, "pointermove", (e) => {
      mx = e.clientX / window.innerWidth; my = 1 - e.clientY / window.innerHeight; moving = 1;
    });
    b.on(window, "pointerleave", () => { moving = 0; });

    b.raf((ts) => {
      const T = ts / 1000;
      /* gentle self-drawing when nobody is moving, so the page is never inert */
      if (!moving || seeded > 0) {
        pmx = mx; pmy = my;
        mx = .5 + Math.sin(T * .55) * .3 + Math.sin(T * .21) * .12;
        my = .5 + Math.cos(T * .42) * .24 + Math.cos(T * .17) * .1;
        if (seeded > 0) seeded--;
      }
      const asp = canvas.width / Math.max(1, canvas.height);

      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[1 - cur].fb);
      gl.viewport(0, 0, SW, SH);
      gl.useProgram(pSim);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
      gl.uniform1i(gl.getUniformLocation(pSim, "u_prev"), 0);
      gl.uniform2f(gl.getUniformLocation(pSim, "u_texel"), 1 / SW, 1 / SH);
      gl.uniform2f(gl.getUniformLocation(pSim, "u_m"), mx, my);
      gl.uniform2f(gl.getUniformLocation(pSim, "u_pm"), pmx, pmy);
      gl.uniform1f(gl.getUniformLocation(pSim, "u_add"), 0.55);
      gl.uniform1f(gl.getUniformLocation(pSim, "u_asp"), asp);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      cur = 1 - cur;
      pmx = mx; pmy = my;

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(pDraw);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
      gl.uniform1i(gl.getUniformLocation(pDraw, "u_tex"), 0);
      gl.uniform1f(gl.getUniformLocation(pDraw, "u_t"), T);
      gl.uniform2f(gl.getUniformLocation(pDraw, "u_res"), canvas.width, canvas.height);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    });

    b.add(() => {
      fbo.forEach(o => { gl.deleteTexture(o.tx); gl.deleteFramebuffer(o.fb); });
      gl.deleteBuffer(quad); gl.deleteProgram(pSim); gl.deleteProgram(pDraw);
      const ext = gl.getExtension("WEBGL_lose_context"); if (ext) ext.loseContext();
    });
  }
};

/* =====================================================================
   VARIANT 10 — SKIN REVEAL          family: interactive / canvas
   The cursor is a stencil: wherever it passes, the app surfaces from
   under the black. The app's own gesture, performed on the website.
   ===================================================================== */
const V_SKIN = {
  id:"skin", label:{it:"Skin Reveal",en:"Skin reveal"}, fam:"interactive",
  css:`
  .sk{position:relative;min-height:100%;background:#0b0a0c;overflow:hidden;
      display:flex;flex-direction:column}
  .sk-under{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
      gap:clamp(8px,2vw,26px);padding:clamp(10px,3vw,40px);
      background:radial-gradient(ellipse at 50% 40%,#2a2731,#0b0a0c 70%)}
  .sk-under figure{margin:0;flex:0 1 clamp(150px,22vw,290px);aspect-ratio:9/19.5;border-radius:clamp(12px,2vw,26px);
      overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.6);
      transform:rotate(var(--r,0deg))}
  .sk-under figure:nth-child(1){--r:-5deg}
  .sk-under figure:nth-child(2){--r:1deg;flex-basis:clamp(170px,25vw,320px)}
  .sk-under figure:nth-child(3){--r:5deg}
  .sk-under img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .sk-mask{position:fixed;inset:0;z-index:1;pointer-events:none}
  .sk-w{position:relative;z-index:3;flex:1 1 auto;display:flex;flex-direction:column;
      justify-content:space-between;padding:clamp(24px,5vw,64px) clamp(22px,5vw,64px);pointer-events:none}
  .sk-w a,.sk-w button{pointer-events:auto}
  .sk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .sk-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;
      color:rgba(255,255,255,.68)}
  .sk-top button{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;background:rgba(0,0,0,.4);
      border:1px solid rgba(255,255,255,.24);color:#fff;border-radius:99px;padding:7px 13px;cursor:pointer}
  .sk-mid{margin:auto 0}
  .sk-h{font-size:clamp(42px,11vw,132px);font-weight:800;font-style:italic;letter-spacing:-.045em;
      line-height:.86;margin:0;color:#fff;mix-blend-mode:difference;max-width:12ch}
  .sk-sub{max-width:34ch;margin:20px 0 0;font-size:clamp(14px,1.7vw,18px);line-height:1.55;
      color:rgba(255,255,255,.82);text-shadow:0 2px 22px rgba(0,0,0,.95)}
  .sk-hint{display:inline-flex;align-items:center;gap:9px;margin-top:22px;font-family:var(--f-mono);
      font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime)}
  .sk-hint i{width:22px;height:22px;flex:0 0 22px;border:1px solid var(--lime);border-radius:50%;display:block;
      animation:skp 1.9s ease-out infinite}
  @keyframes skp{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.7);opacity:0}}
  .sk-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(24px,4vw,40px)}
  .sk-chip{display:inline-flex;align-items:baseline;gap:9px;text-decoration:none;color:#fff;
      padding:10px 15px;border-radius:99px;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.16);transition:.18s}
  .sk-chip:hover{background:var(--lime);color:#0b0a0c;border-color:transparent}
  .sk-chip b{font-size:16px;font-weight:700;white-space:nowrap}
  .sk-chip span{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
      opacity:.7;white-space:nowrap}
  .sk-foot{display:flex;flex-wrap:wrap;gap:10px 24px;font-family:var(--f-mono);font-size:12px;
      letter-spacing:.1em;color:rgba(255,255,255,.6)}
  .sk-foot a{color:inherit;text-decoration:none}
  .sk-foot a:hover{color:var(--lime)}
  `,
  mount(root, b) {
    const wrap = el("div", { class:"sk" });
    root.append(wrap);

    const under = el("div", { class:"sk-under" });
    for (const src of TATTOOO.shots) under.append(el("figure", null, el("img", { src, alt:"" })));
    wrap.append(under);

    const cv = el("canvas", { class:"sk-mask" });
    wrap.append(cv);
    const ctx = cv.getContext("2d");

    const w = el("div", { class:"sk-w" });
    wrap.append(w);

    w.append(el("div", { class:"sk-top" }, [
      el("span", { class:"sk-k", text:COPY.name + " — " + t(COPY.roleShort) }),
      el("button", { text:state.lang === "it" ? "EN" : "IT", onclick:toggleLang })
    ]));

    const mid = el("div", { class:"sk-mid" });
    mid.append(el("h1", { class:"sk-h", html:"Emanuele<br>Malfarà" }));
    mid.append(el("p",  { class:"sk-sub", text:t(COPY.role) }));
    mid.append(el("span", { class:"sk-hint" }, [ el("i"), el("span", { text:t(COPY.move) }) ]));
    const chips = el("div", { class:"sk-list" });
    for (const p of projects()) {
      chips.append(el("a", { class:"sk-chip", href:p.href, target:p.href==="#"?null:"_blank", rel:"noopener" }, [
        el("b", { text:p.name }), el("span", { text:`${p.platform} ${p.year}` })
      ]));
    }
    mid.append(chips);
    w.append(mid);

    w.append(el("div", { class:"sk-foot" }, [
      el("a", { href:LINKS.email, text:LINKS.emailL }),
      el("a", { href:LINKS.github, target:"_blank", rel:"noopener", text:LINKS.githubL }),
      el("a", { href:LINKS.linkedin, target:"_blank", rel:"noopener", text:LINKS.linkedinL })
    ]));

    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + "px"; cv.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#0b0a0c";
      ctx.fillRect(0, 0, W, H);
    }
    resize();
    b.on(window, "resize", resize);

    const pts = [];
    let px = null, py = null, auto = 0;
    b.on(window, "pointermove", (e) => { pts.push({ x:e.clientX, y:e.clientY }); auto = 0; });

    b.raf((ts) => {
      /* the cover slowly heals so old strokes fade back to black */
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(11,10,12,0.030)";
      ctx.fillRect(0, 0, W, H);

      auto++;
      if (auto > 90) {
        const T = ts / 1000;
        pts.push({ x:W * (.5 + Math.sin(T * .5) * .3), y:H * (.5 + Math.cos(T * .37) * .26) });
      }

      ctx.globalCompositeOperation = "destination-out";
      for (const p of pts) {
        if (px !== null) {
          const dx = p.x - px, dy = p.y - py;
          const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 8));
          for (let i = 0; i <= steps; i++) {
            const x = px + dx * (i / steps), y = py + dy * (i / steps);
            const r = 74;
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0,   "rgba(0,0,0,0.30)");
            g.addColorStop(0.55,"rgba(0,0,0,0.14)");
            g.addColorStop(1,   "rgba(0,0,0,0)");
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
          }
        }
        px = p.x; py = p.y;
      }
      pts.length = 0;
      ctx.globalCompositeOperation = "source-over";
    });
  }
};

/* =====================================================================
   ROUTER / CHROME
   ===================================================================== */

const VARIANTS = [V_TERMINAL, V_FLASH, V_WINDOWS, V_INDEX, V_BOARD,
                  V_MARQUEE, V_SPOTLIGHT, V_STACK, V_INK, V_SKIN];

const FAMILY = {
  raw:         { it:"raw / neubrutalist", en:"raw / neubrutalist" },
  typographic: { it:"editoriale / tipografico", en:"editorial / typographic" },
  cinematic:   { it:"dark cinematic", en:"dark cinematic" },
  interactive: { it:"interattivo", en:"interactive" }
};

function render() {
  if (teardown) { teardown.run(); teardown = null; }
  stage.innerHTML = "";
  stage.scrollTop = 0;
  const v = VARIANTS[state.v];
  vcss.textContent = v.css;
  document.documentElement.lang = state.lang;
  const b = bag();
  teardown = b;
  v.mount(stage, b);
  paintChrome();
  location.replace("#" + v.id + "/" + state.lang + (state.many ? "/x5" : ""));
}

function paintChrome() {
  const v = VARIANTS[state.v];
  document.getElementById("vname").innerHTML =
    `<b>${String(state.v + 1).padStart(2,"0")}</b> ${t(v.label)} <span class="fam" id="vfam">· ${t(FAMILY[v.fam])}</span>`;
  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  VARIANTS.forEach((x, i) => {
    chips.append(el("button", { class:"chip" + (i === state.v ? " on" : ""), title:t(x.label),
      text:String(i + 1).padStart(2,"0"), onclick:()=>{ state.v = i; render(); } }));
  });
  document.getElementById("btn-lang").textContent = state.lang === "it" ? "IT ▸ EN" : "EN ▸ IT";
  document.getElementById("btn-many").setAttribute("aria-pressed", String(state.many));
}

function toggleLang() { state.lang = state.lang === "it" ? "en" : "it"; render(); }
function go(n) { state.v = (n + VARIANTS.length) % VARIANTS.length; render(); }

document.getElementById("btn-lang").onclick = toggleLang;
document.getElementById("btn-many").onclick = () => { state.many = !state.many; render(); };
document.getElementById("btn-hide").onclick = () => document.body.classList.add("no-chrome");

addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea")) return;
  if (e.key === "ArrowRight") go(state.v + 1);
  else if (e.key === "ArrowLeft") go(state.v - 1);
  else if (e.key.toLowerCase() === "l") toggleLang();
  else if (e.key.toLowerCase() === "h") document.body.classList.toggle("no-chrome");
  else if (/^[1-9]$/.test(e.key)) go(+e.key - 1);
  else if (e.key === "0") go(9);
});

/* deep link: #flash/en/x5 */
(function boot() {
  const parts = location.hash.replace(/^#/, "").split("/").filter(Boolean);
  const i = VARIANTS.findIndex(v => v.id === parts[0]);
  if (i >= 0) state.v = i;
  if (parts.includes("en")) state.lang = "en";
  if (parts.includes("x5")) state.many = true;
  render();
})();
</script>
